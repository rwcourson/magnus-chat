<svg height="400" width="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .logo {
      fill: #FFFFFF;
      stroke: #FFFFFF;
      stroke-width: 2.2;
      stroke-linejoin: round;
      stroke-linecap: round;
      stroke-dasharray: 1400;
      /* One-shot intro — session gate handles re-show on refresh */
      animation: outlineFill 2.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes outlineFill {
      0% {
        stroke-dashoffset: 1400;
        fill-opacity: 0;
      }
      35% {
        stroke-dashoffset: 0;
        fill-opacity: 0;
      }
      55% {
        stroke-dashoffset: 0;
        fill-opacity: 1;
      }
      100% {
        stroke-dashoffset: 0;
        fill-opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo {
        animation: none;
        stroke-dashoffset: 0;
        fill-opacity: 1;
      }
    }
  </style>

  <g transform="translate(2, 73)">
    <path d="M 0 254
      L 0 0
      L 222 0
      L 307 85
      L 239 85
      L 239 254
      L 154 254
      L 154 85
      L 85 85
      L 85 254
      Z" fill-rule="evenodd" class="logo"></path>
    <rect height="85" width="86" y="0" x="310" class="logo"></rect>
    <path d="M 309 254
      L 396 254
      L 396 171
      L 309 85
      Z" class="logo"></path>
  </g>
</svg>
